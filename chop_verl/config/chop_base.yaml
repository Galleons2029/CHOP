# Shared CHOP settings (math defaults); included by chop_math.yaml and chop_swe.yaml.
data:
  train_files: data/processed/math/dapo_math_17k.parquet
  val_files: data/processed/math/aime24.parquet
  prompt_key: prompt
  max_prompt_length: 2048
  max_response_length: 30000          # cumulative generated-token cap: {1,3,7,15,30,45,60}K
  train_batch_size: 128               # sequences per update
  return_raw_chat: true
  shuffle: true
  seed: 0

actor_rollout_ref:
  model:
    path: Qwen/Qwen3-8B-Base
    use_remove_padding: true
    enable_gradient_checkpointing: true
  actor:
    strategy: fsdp2
    ppo_mini_batch_size: 128
    ulysses_sequence_parallel_size: 1
    optim:
      lr: 5.0e-6
      betas: [0.9, 0.95]
      weight_decay: 0.1
      lr_warmup_steps: 200
      clip_grad: 1.0
  rollout:
    name: vllm
    n: 1
    temperature: 0.7
    top_p: 0.95
    max_model_len: 32768
    agent:
      default_agent_loop: chop_rolling_math
    val_kwargs:
      n: 16                           # avg@16
      temperature: 0.7
      top_p: 0.95
      do_sample: true
  chop:
    teacher_path: deepseek-ai/DeepSeek-R1-0528-Qwen3-8B
    adapter_dir: null                 # outputs/adapters/math (final_answer) for PI-conditioned variants
    native_context: 32768
    rollout_chunk: 4096
    attention: flex                   # flex (GPU) | dense
    block_size: 128
    logit_chunk: 1024
    seed: 0
    calibration_states: null          # torch file with {'rho', 'kappa'} from scripts/run_analysis.py calibrate
    method_file: null                 # resolved experiment YAML (scripts/reproduce.py); overrides `method`
    method:
      name: chop
      beta_outcome: 0.1
      token: {estimator: topk, topk: 64, support: student}
      segment: {num_anchors: 8, num_student_segments: 8, segment_length: 64, num_projections: 32,
                distance: sw, estimator: loo_norm, max_windows_per_traj: 32}
      router: {window: 8192, rho_quantile: 0.30, kappa_quantile: 0.70, refresh: 64, min_history: 256}
      reliability: {variant: calibrated, lambda_entropy: 1.0, lambda_tv: 1.0}
      pi: {sources: [], interface: lora_prefix}

custom_reward_function:
  path: chop_verl/rewards.py
  name: compute_score

algorithm:
  adv_estimator: grpo                 # unused: CHOP replaces the advantage/update path

trainer:
  project_name: chop
  experiment_name: math_chop
  n_gpus_per_node: 8
  nnodes: 1
  total_training_steps: 250           # per cap
  total_epochs: 100
  save_freq: 50
  test_freq: 50
  val_before_train: true
  logger: [console]
