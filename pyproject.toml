[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chop-opd"
version = "0.1.0"
description = "CHOP: Counterfactual Hierarchical On-Policy Distillation for long-horizon agents (reference implementation)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [
  { name = "Jialong Liu" },
  { name = "Zuchao Li" },
  { name = "Yuling Shi" },
  { name = "Lefei Zhang" },
  { name = "Baoyuan Qi" },
  { name = "Hai Zhao" },
]
dependencies = [
  "torch>=2.5",          # FlexAttention for tree-packed segment branches
  "numpy>=1.26",
  "scipy>=1.11",
  "omegaconf>=2.3",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
hf = ["transformers>=4.51", "peft>=0.15"]
math = ["math-verify>=0.7", "datasets>=2.19"]
swe = ["swebench>=4.0", "tree-sitter>=0.21", "tree-sitter-python>=0.21", "python-lsp-server>=1.11", "unidiff>=0.7"]
verl = ["verl>=0.5", "vllm>=0.8.5", "ray>=2.40"]
plot = ["matplotlib>=3.8"]
dev = ["pytest>=8", "ruff>=0.5", "pot>=0.9", "matplotlib>=3.8"]

[tool.setuptools.packages.find]
include = ["chop*", "chop_verl*", "envs*", "pi_extraction*", "adapters*", "analysis*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "slow: tests that build or run small models end-to-end",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E741"]

[tool.ruff.lint.per-file-ignores]
"scripts/gen_experiment_configs.py" = ["E501"]   # a data table of the paper's reported values
