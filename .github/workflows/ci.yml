name: ci
on: [push, pull_request]
jobs:
  cpu-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r environment/requirements-cpu.txt && pip install -e .
      - run: ruff check .
      - run: pytest -m "not slow"
      - run: pytest -m slow
